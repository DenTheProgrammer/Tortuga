[package]
name = "tortuga-core"
description = "Tortuga torrent engine: librqbit session management, HTTP API and streaming"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tortuga-server"
path = "src/bin/tortuga-server.rs"

[dependencies]
librqbit-tracker-comms = "9"
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
anyhow = "1"
axum = { version = "0.8", features = ["json", "query", "tokio", "http1"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
feed-rs = "2"
futures = "0.3"
hex = "0.4"
mime_guess = "2"
netdev = "0.46"
parking_lot = "0.12"
rand = "0.9"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
